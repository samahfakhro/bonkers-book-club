<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Book Positioner</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #111; color: #fff; font-family: monospace; }
    #info {
      position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
      background: rgba(0,0,0,0.85); border: 1px solid #555; border-radius: 8px;
      padding: 10px 18px; font-size: 13px; z-index: 100; text-align: center;
      pointer-events: none; white-space: nowrap;
    }
    #info span { color: #f9d174; font-weight: bold; }
    #info .b2c { color: #74c9f9; font-weight: bold; }
    #canvas {
      position: relative; display: inline-block;
      height: 100vh; overflow: hidden;
    }
    #room { height: 100%; width: auto; display: block; }
    .book-el {
      position: absolute; cursor: move; user-select: none;
    }
    .book-el img { height: 100%; width: auto; display: block; pointer-events: none; }
    .book-el.active { outline: 2px dashed rgba(249,209,116,0.9); }
    .book-el.inactive { outline: 2px dashed rgba(116,201,249,0.5); }
    .resize-dot {
      position: absolute; bottom: -6px; right: -6px;
      width: 14px; height: 14px; border-radius: 50%; cursor: se-resize;
    }
    .active .resize-dot { background: #f9d174; }
    .inactive .resize-dot { background: #74c9f9; }
    #copy {
      position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: #f9d174; color: #111; border: none; border-radius: 8px;
      padding: 10px 24px; font-size: 14px; font-weight: bold;
      cursor: pointer; z-index: 100;
    }
    #hint {
      position: fixed; bottom: 65px; left: 50%; transform: translateX(-50%);
      font-size: 11px; color: #888; z-index: 100; pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info">
    book1: left <span id="vl1">-</span> top <span id="vt1">-</span> h <span id="vh1">-</span>
    &nbsp;&nbsp;|&nbsp;&nbsp;
    book2: left <span class="b2c" id="vl2">-</span> top <span class="b2c" id="vt2">-</span> h <span class="b2c" id="vh2">-</span>
  </div>

  <div id="canvas">
    <img id="room" src="/bonkyhouse_room.png" alt="">
    <div id="book1" class="book-el active" style="left:0%;top:18.8%;height:15.5%">
      <img src="/book1.png" alt="">
      <div class="resize-dot"></div>
    </div>
    <div id="book2" class="book-el inactive" style="left:8%;top:18.8%;height:15.5%">
      <img src="/book2.png" alt="">
      <div class="resize-dot"></div>
    </div>
  </div>

  <div id="hint">tap a book to select it (yellow = book1, blue = book2)</div>
  <button id="copy" onclick="copyVals()">Copy both values</button>

  <script>
    const canvas = document.getElementById('canvas')
    const books = ['book1','book2']
    const spans = {
      book1: { l: document.getElementById('vl1'), t: document.getElementById('vt1'), h: document.getElementById('vh1') },
      book2: { l: document.getElementById('vl2'), t: document.getElementById('vt2'), h: document.getElementById('vh2') },
    }

    function pct(val, total) { return (val / total * 100).toFixed(1) + '%' }
    function updateInfo(id) {
      const el = document.getElementById(id)
      const cw = canvas.offsetWidth, ch = canvas.offsetHeight
      spans[id].l.textContent = pct(el.offsetLeft, cw)
      spans[id].t.textContent = pct(el.offsetTop, ch)
      spans[id].h.textContent = pct(el.offsetHeight, ch)
    }
    books.forEach(id => updateInfo(id))

    let activeId = 'book1'
    function setActive(id) {
      activeId = id
      books.forEach(b => {
        document.getElementById(b).className = 'book-el ' + (b === id ? 'active' : 'inactive')
      })
    }

    let action = null // { type: 'drag'|'resize', id, startX, startY, startL, startT, startH }

    books.forEach(id => {
      const el = document.getElementById(id)
      const rd = el.querySelector('.resize-dot')

      function onDown(cx, cy, isResize, e) {
        e.preventDefault(); e.stopPropagation()
        setActive(id)
        if (isResize) {
          action = { type: 'resize', id, startY: cy, startH: el.offsetHeight }
        } else {
          action = { type: 'drag', id, startX: cx, startY: cy, startL: el.offsetLeft, startT: el.offsetTop }
        }
      }

      rd.addEventListener('mousedown', e => onDown(e.clientX, e.clientY, true, e))
      rd.addEventListener('touchstart', e => onDown(e.touches[0].clientX, e.touches[0].clientY, true, e), { passive: false })
      el.addEventListener('mousedown', e => { if (e.target !== rd) onDown(e.clientX, e.clientY, false, e) })
      el.addEventListener('touchstart', e => { if (e.target !== rd) onDown(e.touches[0].clientX, e.touches[0].clientY, false, e) }, { passive: false })
    })

    function onMove(cx, cy) {
      if (!action) return
      const el = document.getElementById(action.id)
      if (action.type === 'drag') {
        el.style.left = (action.startL + cx - action.startX) + 'px'
        el.style.top  = (action.startT + cy - action.startY) + 'px'
      } else {
        el.style.height = Math.max(20, action.startH + cy - action.startY) + 'px'
      }
      updateInfo(action.id)
    }
    document.addEventListener('mousemove', e => onMove(e.clientX, e.clientY))
    document.addEventListener('touchmove', e => { e.preventDefault(); onMove(e.touches[0].clientX, e.touches[0].clientY) }, { passive: false })
    document.addEventListener('mouseup', () => action = null)
    document.addEventListener('touchend', () => action = null)

    function copyVals() {
      const b1 = `book1 → left: '${spans.book1.l.textContent}'  top: '${spans.book1.t.textContent}'  height: '${spans.book1.h.textContent}'`
      const b2 = `book2 → left: '${spans.book2.l.textContent}'  top: '${spans.book2.t.textContent}'  height: '${spans.book2.h.textContent}'`
      navigator.clipboard.writeText(b1 + '\n' + b2).then(() => {
        document.getElementById('copy').textContent = 'Copied!'
        setTimeout(() => document.getElementById('copy').textContent = 'Copy both values', 1500)
      })
    }
  </script>
</body>
</html>
